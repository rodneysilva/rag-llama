<text x="636" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#7c3aed">OpenAI-compat · túnel</text>
<rect x="24" y="556" width="1152" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="48" y="586" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">conceitos do desenho</text>
<text x="48" y="612" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">• camadas = processos independentes (reiniciam/escalam separados) · faixa roxa = opcional (sem GPU, aponte para qualquer endpoint OpenAI-compatible)</text>
<text x="48" y="634" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">• toda tarefa longa (chat, ingestão, mídia, sandbox, pesquisa) é um JOB na fila — a UI nunca bloqueia e jobs sobrevivem a restarts</text>
<text x="48" y="656" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">• comportamento da LLM vive em core/specs/*.md (editar spec ≠ editar código) · coleções do Qdrant são genéricas por domínio</text>
<text x="48" y="678" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">• modo Revisão: NADA entra na base sem aprovação (chunks, duplicados, clusters e score de aderência visíveis antes de aplicar)</text>
