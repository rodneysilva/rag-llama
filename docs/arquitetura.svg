<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="330" fill="#0f141a"/>
  <text x="24" y="34" fill="#e8eaf0" font-size="17" font-weight="600">RagAroy — arquitetura em camadas</text>
  <text x="24" y="52" fill="#7f8b99" font-size="11">usuário → webui HTMX → API FastAPI (executor async de jobs) → dados · estação GPU opcional</text>

  <!-- usuário -->
  <rect x="24" y="72" width="120" height="46" rx="10" fill="#1a212b" stroke="#2c3644"/>
  <text x="84" y="99" fill="#cfd6df" font-size="12" text-anchor="middle">👤 navegador</text>

  <!-- api -->
  <rect x="176" y="66" width="300" height="150" rx="12" fill="#14202c" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="326" y="90" fill="#8fb8e8" font-size="13" font-weight="600" text-anchor="middle">api :8000 — FastAPI + webui (HTMX)</text>
  <rect x="192" y="102" width="268" height="30" rx="8" fill="#1b2a3a" stroke="#31597e"/>
  <text x="326" y="121" fill="#a9c6e2" font-size="11" text-anchor="middle">⚙️ executor async de jobs (in-process)</text>
  <rect x="192" y="138" width="128" height="28" rx="8" fill="#1b2a3a" stroke="#31597e"/>
  <text x="256" y="156" fill="#a9c6e2" font-size="11" text-anchor="middle">🧭 bússola (Qdrant)</text>
  <rect x="330" y="138" width="130" height="28" rx="8" fill="#1b2a3a" stroke="#31597e"/>
  <text x="395" y="156" fill="#a9c6e2" font-size="11" text-anchor="middle">🌐 provedores LLM</text>
  <rect x="192" y="172" width="268" height="28" rx="8" fill="#1b2a3a" stroke="#31597e"/>
  <text x="326" y="190" fill="#a9c6e2" font-size="11" text-anchor="middle">📊 contadores em arquivo · telemetria jsonl</text>

  <!-- dados -->
  <rect x="508" y="66" width="160" height="70" rx="10" fill="#221a10" stroke="#a06a1f"/>
  <text x="588" y="92" fill="#e8c98f" font-size="12" text-anchor="middle" font-weight="600">🗄️ qdrant</text>
  <text x="588" y="110" fill="#b89b6b" font-size="10.5" text-anchor="middle">vetores + full-text</text>
  <rect x="508" y="146" width="160" height="70" rx="10" fill="#101f18" stroke="#2f7d4f"/>
  <text x="588" y="172" fill="#9fd8b4" font-size="12" text-anchor="middle" font-weight="600">🧪 sandbox</text>
  <text x="588" y="190" fill="#7bab8f" font-size="10.5" text-anchor="middle">execução isolada + sites</text>

  <!-- estação -->
  <rect x="700" y="66" width="156" height="192" rx="12" fill="#191428" stroke="#6b4fa0"/>
  <text x="778" y="90" fill="#c3aee8" font-size="12" font-weight="600" text-anchor="middle">estação com GPU</text>
  <text x="778" y="106" fill="#8d7bab" font-size="10" text-anchor="middle">(opcional — a SUA máquina)</text>
  <rect x="712" y="116" width="132" height="26" rx="7" fill="#241c38"/>
  <text x="778" y="133" fill="#b7a4dd" font-size="10.5" text-anchor="middle">llama-server :8090/:8081</text>
  <rect x="712" y="148" width="132" height="26" rx="7" fill="#241c38"/>
  <text x="778" y="165" fill="#b7a4dd" font-size="10.5" text-anchor="middle">visão :8082 (on-demand)</text>
  <rect x="712" y="180" width="132" height="26" rx="7" fill="#241c38"/>
  <text x="778" y="197" fill="#b7a4dd" font-size="10.5" text-anchor="middle">agente :8010 · troca</text>
  <rect x="712" y="212" width="132" height="26" rx="7" fill="#241c38"/>
  <text x="778" y="229" fill="#b7a4dd" font-size="10.5" text-anchor="middle">sd-cli · Flux · Wan · whisper</text>

  <!-- setas -->
  <line x1="144" y1="95" x2="176" y2="95" stroke="#7f8b99" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="476" y1="100" x2="508" y2="100" stroke="#7f8b99" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="476" y1="180" x2="508" y2="180" stroke="#7f8b99" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="476" y1="140" x2="700" y2="140" stroke="#6b4fa0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s)"/>
  <text x="588" y="132" fill="#7f8b99" font-size="10" text-anchor="middle">túnel</text>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8b99"/>
    </marker>
  </defs>

  <text x="24" y="286" fill="#7f8b99" font-size="10.5">Toda tarefa longa é um job no executor async (fila serial, retry com backoff p/ transientes) — sem broker externo.</text>
  <text x="24" y="302" fill="#7f8b99" font-size="10.5">A GPU é a estação do usuário; o servidor não hospeda modelos de linguagem (llm/embed/agente via túnel).</text>
</svg>
