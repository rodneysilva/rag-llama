<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RagAroy sandbox — {{ titulo }}</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: 'Segoe UI', system-ui, sans-serif;
         background: #f6f7f9; color: #1a1d21; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1216; color: #e6e9ee; }
    .card { border-color: #2a3138 !important; }
  }
  .card { max-width: 34rem; margin: 2rem 1rem; padding: 2rem 2.2rem;
          background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
          text-align: center; }
  @media (prefers-color-scheme: dark) { .card { background: #161a20; } }
  .emo { font-size: 2.6rem; }
  h1 { font-size: 1.15rem; margin: .8rem 0 .4rem; }
  p { font-size: .92rem; line-height: 1.55; opacity: .82; margin: .4rem 0; }
  code { background: rgba(127,127,127,.14); padding: .1rem .45rem;
         border-radius: 6px; font-size: .85em; }
  a.voltar { display: inline-block; margin-top: 1.2rem; padding: .55rem 1.2rem;
             border-radius: 10px; text-decoration: none; font-weight: 600;
             background: #2563eb; color: #fff; }
  .mini { font-size: .75rem; opacity: .55; margin-top: 1.4rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="emo">{{ emo }}</div>
    <h1>{{ titulo }}</h1>
    <p>{{ detalhe }}</p>
    {% if extras %}<p>{{ extras }}</p>{% endif %}
    <a class="voltar" href="https://ai.disroy.org/">voltar ao RagAroy</a>
    <p class="mini">Os aplicativos de teste ficam hospedados por ~30 min em
    sandbox.disroy.org — um novo teste do mesmo app substitui o link antigo.</p>
  </div>
</body>
</html>
