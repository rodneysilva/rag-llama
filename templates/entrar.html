<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- barra do navegador do celular acompanha o tema (claro/escuro) -->
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
  <title>entrar — RagAroy</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ v_fav }}">
  <link rel="stylesheet" href="/static/app.css?v={{ v_css }}">
</head>
<body>
<main style="max-width:22rem; margin-top:12vh;">
  <section class="cartao">
    <a class="marca" href="/" title="RagAroy" style="justify-content:center; margin-bottom:.4rem;">
      <img src="/static/logo.svg?v={{ v_fav }}" alt="RagAroy" width="34" height="34">
      <span style="font-size:1.2rem;">RagAroy</span>
    </a>
    <p class="mut" style="text-align:center;">conversa com conhecimento local (RAG) — entre para continuar.</p>
    {% if erro %}<p class="erro-texto">{{ erro }}</p>{% endif %}
    <form method="post" action="/entrar">
      <label>usuário</label>
      <input type="text" name="user" autofocus required>
      <label>senha</label>
      <input type="password" name="senha" required>
      <div style="margin-top:.9rem;">
        <button class="primario" type="submit" style="width:100%;">entrar</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
