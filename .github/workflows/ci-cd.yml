# CI/CD — GitFlow: develop integra (CI), main publica (CD/deploy)
# NENHUM dado sensível aqui: IP/usuário/chave vêm dos secrets do repositório.
name: ci-cd

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

# runs superseded se cancelam: pushes rápidos em sequência não empilham
# deploys na fila (um run "queued" zumbi do GitHub já atrasou deploy e um
# dispatch manual bateu startup_failure na corrida); o deploy mais NOVO
# é o que vale — `git pull --ff-only` na VPS garante o commit da ponta.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe Python
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./.git/*" -not -path "*/node_modules/*" -not -path "./webui/*") || true
          echo "CI ok"

  # scripts genéricos precisam valer em TODOS os sistemas operacionais
  # (o usuário pode rodar em Windows, Linux ou macOS)
  ci-multi-os:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxe do servicos_llm.py
        run: python -m py_compile servicos_llm.py
      - name: Modo não-interativo (sem MODELS_DIR)
        shell: python
        run: |
          import subprocess, sys
          r = subprocess.run([sys.executable, "servicos_llm.py", "--listar"],
                             capture_output=True, text=True, input="")
          print(r.stdout, r.stderr)
          # sem MODELS_DIR e sem terminal: sai com instrução clara (não trava)
          assert r.returncode == 1 and "MODELS_DIR" in (r.stdout + r.stderr)

  cd:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy no servidor
        run: |
          ssh -p ${{ secrets.VPS_PORT }} \
              -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
            set -e
            cd ~/apps/rag-llama
            git pull --ff-only
            mkdir -p sessions saidas logs datasets modelos_voz qdrant_data
            [[ -f users.json ]] || echo '{}' > users.json
            COMPOSE="docker compose -f docker-compose.yml -f $HOME/infra/services/rag-llama/docker-compose.prod.yml"
            $COMPOSE up -d qdrant
            docker compose -f docker-compose.yml build sandbox
            $COMPOSE up -d --no-deps sandbox
            $COMPOSE build api
            $COMPOSE up -d --force-recreate --no-deps api
            $COMPOSE ps
          REMOTE

  # ── AMBIENTE DEV (dev.disroy.org) ─────────────────────────────
  # GitFlow completo: develop = dev.disroy.org (deploy automático em
  # cada push), main = ai.disroy.org (produção — alias raga/ia). Stack separada
  # (~/apps/rag-llama-dev, containers ragaroy-dev-*), volumes e estado
  # PRÓPRIOS, reranker OFF (CPU disputada com o prod), GPU segue 100%
  # na estação do usuário via túneis llm/embed/agente.disroy.org.
  cd-dev:
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy no ambiente dev
        run: |
          ssh -p ${{ secrets.VPS_PORT }} \
              -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
            set -e
            # clone único (branch develop) — os pulls seguintes são --ff-only
            if [[ ! -d ~/apps/rag-llama-dev ]]; then
              git clone -b develop https://github.com/rodneysilva/rag-llama.git ~/apps/rag-llama-dev
            fi
            cd ~/apps/rag-llama-dev
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            mkdir -p sessions saidas logs datasets qdrant_data
            [[ -f users.json ]] || echo '{}' > users.json
            # .env do dev: parte do prod (chaves/túneis) — criado 1x
            if [[ ! -f .env ]]; then
              cp ~/apps/rag-llama/.env .env
            fi
            if [[ ! -f usuarios_permitidos.txt ]]; then
              cp ~/apps/rag-llama/usuarios_permitidos.txt usuarios_permitidos.txt
            fi
            for f in mcp_servers.json mcp_conhecidos.json; do
              [[ -f $f ]] || cp ~/apps/rag-llama/$f $f
            done
            COMPOSE="docker compose -f docker-compose.yml -f $HOME/infra/services/rag-llama-dev/docker-compose.prod.yml"
            $COMPOSE up -d qdrant
            docker compose -f docker-compose.yml build sandbox
            $COMPOSE up -d --no-deps sandbox
            $COMPOSE build api
            $COMPOSE up -d --force-recreate --no-deps api
            $COMPOSE ps
          REMOTE
